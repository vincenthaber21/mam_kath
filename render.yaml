services:
  - type: web
    name: eic-website
    runtime: docker
    plan: starter
    disk:
      name: media
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://eic-website.onrender.com"
      - key: MEDIA_ROOT
        value: /data/media
      - key: SERVE_MEDIA
        value: "True"
      - key: EIC_DEMO_MODE
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: eic-db
          property: connectionString
databases:
  - name: eic-db
    plan: free
